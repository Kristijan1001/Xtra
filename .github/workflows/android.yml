name: Android

on:
  push:
    branches: [master, battery-efficiency]
    paths-ignore: ['docs/**', 'windows/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', 'windows/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint and build optimized APK
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: xtra-plus-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: error
